name: Build and deploy SpendWise

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-spendwise
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: Spendwise   # <-- change to your App Service name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular (outputs into src/main/resources/static)
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Spring Boot jar
        # skip.* flags only matter if frontend-maven-plugin is still in the pom;
        # Angular was already built above, so don't build it twice.
        run: mvn -B -ntp clean package -Dskip.npm -Dskip.installnodenpm

      - name: Verify the UI is inside the jar
        run: unzip -l target/*.jar | grep -q "BOOT-INF/classes/static/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: spendwise-jar
          path: target/*.jar

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spendwise-jar

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '*.jar'
